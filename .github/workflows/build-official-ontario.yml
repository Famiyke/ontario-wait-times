name: Build official Ontario surgery report from FAO tables
on:
  push:
    paths:
      - 'official_ontario_fao_surgery.py'
      - '.github/workflows/build-official-ontario.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verified-real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests beautifulsoup4
      - run: python official_ontario_fao_surgery.py
      - name: Verify official output
        run: |
          python - <<'PY'
          import csv
          with open('official_ontario_fao_surgery_2019_2022.csv',newline='',encoding='utf8') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==276
          assert {x['metric'] for x in rows}=={
              'surgeries_performed','average_waitlist','fao_estimated_wait_months'}
          assert {int(x['year']) for x in rows}=={2019,2020,2021,2022}
          assert all(x['source_url']=='https://fao-on.org/en/report/health-2023/' for x in rows)
          print('PASS official Ontario FAO source, 276 metric-year rows')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-ontario-fao-surgery
          path: |
            official_ontario_fao_surgery_2019_2022.csv
            OFFICIAL_ONTARIO_SURGERY_FINDINGS.md
      - name: Commit officially sourced aggregates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official_ontario_fao_surgery_2019_2022.csv OFFICIAL_ONTARIO_SURGERY_FINDINGS.md
          git diff --cached --quiet || (git commit -m "Publish source-verified real Ontario FAO surgical aggregates" && git push)
