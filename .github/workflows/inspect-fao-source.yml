name: Inspect Ontario FAO public surgery report tables
on:
  push:
    paths: ['.github/workflows/inspect-fao-source.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas lxml requests beautifulsoup4
      - name: Identify actual Ontario surgery data table in official FAO report
        run: |
          python - <<'PY'
          import requests,pandas as pd,io
          from bs4 import BeautifulSoup
          url='https://fao-on.org/en/report/health-2023/'
          r=requests.get(url,timeout=40,headers={'User-Agent':'Mozilla/5.0'})
          print('HTTP',r.status_code,'bytes',len(r.content));r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          tables=soup.find_all('table')
          print('TABLE ELEMENTS',len(tables))
          for i,table in enumerate(tables):
              txt=table.get_text(' ',strip=True)
              if 'General Surgery' in txt and ('2019' in txt or '2022' in txt):
                  print('CANDIDATE',i,txt[:1050])
                  print('BEFORE',table.find_previous(['h2','h3','h4','p']).get_text(' ',strip=True)[:300] if table.find_previous(['h2','h3','h4','p']) else '')
          PY
